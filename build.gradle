plugins {
    id 'java'
}

group = 'org.example'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation group: 'org.assertj', name: 'assertj-core', version: '3.27.7'
    testCompileOnly group: 'org.projectlombok', name: 'lombok', version: '1.18.46'
    testAnnotationProcessor group: 'org.projectlombok', name: 'lombok', version: '1.18.46'
}

compileJava {
    options.encoding = 'UTF-8'
}

compileTestJava {
    options.encoding = 'UTF-8'
}


test {
    useJUnitPlatform()
}